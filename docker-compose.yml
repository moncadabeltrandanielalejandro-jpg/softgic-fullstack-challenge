name: softgic-solicitudes

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ChangeMe_2026!Local}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-init:
    image: mcr.microsoft.com/mssql-tools:latest
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: >
      bash -c "
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"IF DB_ID('$$MSSQL_DB_SOLICITUDES') IS NULL CREATE DATABASE [$$MSSQL_DB_SOLICITUDES]\" &&
      /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"IF DB_ID('$$MSSQL_DB_INDICADORES') IS NULL CREATE DATABASE [$$MSSQL_DB_INDICADORES]\"
      "
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ChangeMe_2026!Local}
      MSSQL_DB_SOLICITUDES: ${MSSQL_DB_SOLICITUDES:-solicitudes_db}
      MSSQL_DB_INDICADORES: ${MSSQL_DB_INDICADORES:-indicadores_db}

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-ChangeMe_2026!Local}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

  solicitudes-service:
    build:
      context: .
      dockerfile: backend/solicitudes-service/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DB_HOST: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ChangeMe_2026!Local}
      MSSQL_DB_SOLICITUDES: ${MSSQL_DB_SOLICITUDES:-solicitudes_db}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/${KEYCLOAK_REALM:-softgic-solicitudes}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-softgic-solicitudes}/protocol/openid-connect/certs
    ports:
      - "8081:8081"

  indicadores-service:
    build:
      context: .
      dockerfile: backend/indicadores-service/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      DB_HOST: sqlserver
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-ChangeMe_2026!Local}
      MSSQL_DB_INDICADORES: ${MSSQL_DB_INDICADORES:-indicadores_db}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/${KEYCLOAK_REALM:-softgic-solicitudes}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-softgic-solicitudes}/protocol/openid-connect/certs
    ports:
      - "8082:8082"

  mfe-solicitudes:
    build:
      context: ./frontend/mfe-solicitudes
    ports:
      - "3001:3001"

  shell:
    build:
      context: ./frontend/shell
    depends_on:
      - mfe-solicitudes
    ports:
      - "3000:3000"

volumes:
  sqlserver-data:
