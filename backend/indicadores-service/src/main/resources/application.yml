server:
  port: ${INDICADORES_SERVICE_PORT:8082}

spring:
  application:
    name: indicadores-service
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${MSSQL_DB_INDICADORES:indicadores_db};encrypt=true;trustServerCertificate=true
    username: ${DB_USER:sa}
    password: ${MSSQL_SA_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: indicadores-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/softgic-solicitudes}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/softgic-solicitudes/protocol/openid-connect/certs}

kafka:
  topic:
    solicitudes-eventos: ${KAFKA_TOPIC_SOLICITUDES_EVENTOS:solicitudes.eventos}

management:
  endpoints:
    web:
      exposure:
        include: health,info
